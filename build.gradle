plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teamehera'
version = '0.0.1-SNAPSHOT'
description = 'KIIKICK-back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()

    // Keep automated tests isolated from externally configured databases such as RDS.
    systemProperty 'spring.datasource.url', 'jdbc:h2:mem:kiikick;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE'
    systemProperty 'spring.datasource.username', 'sa'
    systemProperty 'spring.datasource.password', ''
    systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
}

sourceSets {
    mysqlIntegrationTest {
        java.srcDir 'src/mysqlIntegrationTest/java'
        resources.srcDir 'src/mysqlIntegrationTest/resources'
        compileClasspath = sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath = output + compileClasspath + configurations.testRuntimeClasspath
    }
}

tasks.register('mysqlIntegrationTest', Test) {
    description = 'Runs Repository integration tests against kiikick_repository_test only.'
    group = 'verification'
    testClassesDirs = sourceSets.mysqlIntegrationTest.output.classesDirs
    classpath = sourceSets.mysqlIntegrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')

    doFirst {
        String database = System.getenv('MYSQL_TEST_DB_NAME')
        String host = System.getenv('MYSQL_TEST_DB_HOST')
        String port = System.getenv('MYSQL_TEST_DB_PORT')
        String username = System.getenv('MYSQL_TEST_DB_USERNAME')
        String password = System.getenv('MYSQL_TEST_DB_PASSWORD')

        if (database != 'kiikick_repository_test') {
            throw new GradleException(
                    'MYSQL_TEST_DB_NAME must be exactly kiikick_repository_test'
            )
        }
        if ([host, port, username, password].any { it == null || it.isBlank() }) {
            throw new GradleException(
                    'MYSQL_TEST_DB_HOST, MYSQL_TEST_DB_PORT, MYSQL_TEST_DB_USERNAME, '
                            + 'and MYSQL_TEST_DB_PASSWORD are required'
            )
        }

        String jdbcUrl = "jdbc:mysql://${host}:${port}/${database}" +
                "?sslMode=REQUIRED&connectionTimeZone=UTC" +
                "&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8"

        systemProperty 'spring.datasource.url', jdbcUrl
        systemProperty 'spring.datasource.username', username
        systemProperty 'spring.datasource.password', password
        systemProperty 'spring.datasource.driver-class-name', 'com.mysql.cj.jdbc.Driver'
        systemProperty 'spring.sql.init.mode', 'never'
        systemProperty 'kiikick.mysql.integration.enabled', 'true'
    }
}
