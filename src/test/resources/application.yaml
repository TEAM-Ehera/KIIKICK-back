spring:
  datasource:
    url: jdbc:h2:mem:kiikick;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  sql:
    init:
      mode: always

kiikick:
  auth:
    access-token:
      secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: kiikick-api-test
      audience: kiikick-test
      lifetime: 15m
    verification:
      email-code-secret: test-email-code-hmac-secret-32-bytes-minimum
      ip-secret: test-ip-address-hmac-secret-32-bytes-minimum
      sender-address: no-reply@kiikick.test
      sender-name: KIIKICK Test
